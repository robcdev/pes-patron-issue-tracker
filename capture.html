<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Select area — Screenshot to Folder</title>
  <link rel="stylesheet" href="capture.css" />
</head>
<body>
  <header class="page-header">
    <div class="page-header-inner">
      <h1>Select the area to capture</h1>
      <p class="sub">Drag a rectangle on the screenshot. Release to set the region, then Save.</p>
    </div>
  </header>

  <main class="page-main">
    <div id="empty" class="notice hidden">
      <p>Nothing to crop. Open the extension popup and click <strong>Select area…</strong> again.</p>
    </div>

    <div id="workspace" class="workspace hidden">
      <div class="stage-wrap">
        <div id="stage" class="stage">
          <img id="shot" alt="page screenshot" draggable="false" />
          <div id="sel" class="selection hidden"></div>
        </div>
        <p id="sel-info" class="sel-info">No selection yet — drag on the image.</p>
      </div>

      <aside class="panel">
        <label class="field-label" for="subpath">Subfolder (inside base folder)</label>
        <input id="subpath" type="text" autocomplete="off" />
        <label class="field-label" for="prefix">Filename prefix (optional)</label>
        <input id="prefix" type="text" autocomplete="off" />
        <label class="field-label" for="url">URL</label>
        <input id="url" type="text" autocomplete="off" />
        <label class="field-label" for="description">Issue description</label>
        <textarea id="description" rows="3"></textarea>
        <label class="field-label" for="mini-prompt">Mini-prompt for Claude (optional)</label>
        <textarea id="mini-prompt" rows="3"></textarea>
        <p id="network-note" class="network-note"></p>
        <p class="hint">Saving to: <span id="target-preview">—</span></p>
        <div class="actions">
          <button id="save" class="primary" disabled>Save section</button>
          <button id="reset" class="secondary">Clear selection</button>
        </div>
        <p id="status" class="status"></p>
      </aside>
    </div>
  </main>

  <script src="lib.js"></script>
  <script src="capture.js"></script>
</body>
</html>
