<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="toolbar">
    <span class="title">Screenshot to Folder</span>
    <div class="actions">
      <button id="tab-camera" class="icon-btn active" title="Take a screenshot">📷</button>
      <button id="tab-edit" class="icon-btn" title="Edit references">✏️</button>
      <button id="tab-settings" class="icon-btn" title="Settings">⚙️</button>
    </div>
  </header>

  <!-- CAMERA VIEW -->
  <section id="view-camera" class="view">
    <label class="field-label" for="subpath">Subfolder (inside base folder)</label>
    <input id="subpath" type="text" placeholder="the/rest/of/the/path" autocomplete="off" />
    <label class="field-label" for="prefix">Filename prefix (optional)</label>
    <input id="prefix" type="text" placeholder="e.g. login-page" autocomplete="off" />
    <label class="field-label" for="url">URL</label>
    <input id="url" type="text" placeholder="https://…" autocomplete="off" />
    <label class="field-label" for="description">Issue description</label>
    <textarea id="description" rows="2" placeholder="e.g. the meetings component does not display the time correctly"></textarea>
    <label class="field-label" for="mini-prompt">Mini-prompt for Claude (optional)</label>
    <textarea id="mini-prompt" rows="2" placeholder="e.g. make the field a little wider so the data fits"></textarea>
    <label class="checkbox-row">
      <input id="include-network" type="checkbox" />
      <span>Include network data</span>
    </label>
    <label class="checkbox-row">
      <input id="include-console" type="checkbox" />
      <span>Include console data</span>
    </label>
    <div id="committed-list" class="committed-list hidden"></div>

    <div id="region-preview" class="region-preview hidden">
      <span class="field-label">Screenshot to save</span>
      <img id="region-thumb" alt="captured screenshot preview" />
      <button id="add-screenshot" class="primary alt">Add screenshot</button>
      <button id="discard-region" class="link-btn">Discard</button>
    </div>

    <p class="hint" id="target-hint">Saving to: <span id="target-preview">—</span></p>

    <button id="save-all" class="primary" disabled>Save</button>
    <button id="clear-all" class="link-btn hidden">Clear all screenshots</button>

    <div class="button-row">
      <button id="take" class="primary">Take full page</button>
      <button id="select-area" class="primary alt" title="Capture a region">Select area…</button>
    </div>
    <p id="camera-status" class="status"></p>
  </section>

  <script src="lib.js"></script>
  <script src="popup.js"></script>
</body>
</html>
